name: CodeQL

# Code scanning with results in the Security tab (free for public repositories).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  analyze:
    runs-on: macos-26
    permissions: { contents: read, security-events: write }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        working-directory: Packages/NeraKit
        run: swift build
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          upload: always
